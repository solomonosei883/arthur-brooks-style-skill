<meta charset="utf-8">
<title>Edit Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,600;1,700&display=swap">
<style>
/* Layout: one column of beat cards; each card = plan + options (left) | script, beat clip, reel note (right). */
:root{
  --bg:#EEF1F5; --card:#FFFFFF; --panel:#F6F7FA; --ink:#111318; --muted:#5B6478; --faint:#8A93A6; --line:#E2E6EC;
  --accent:#1E9BF0; --accent-ink:#0B6FC0; --accent-soft:#E4F3FD; --aroll:#DADFE7; --overlay:#A9DAFB; --cut:#1E9BF0;
  --ok:#2E8B57; --warn:#B26B00;
  --sans:"Inter","Helvetica Neue",Arial,sans-serif; --serif:"Playfair Display",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1015; --card:#161A21; --panel:#1B2029; --ink:#EEF1F6; --muted:#A3ACBE; --faint:#7D879B; --line:#2A303B;
  --accent:#4AB3F6; --accent-ink:#7CC8FA; --accent-soft:#16324A; --aroll:#3A414E; --overlay:#2D6A93; --cut:#3BA5F2; --ok:#5FC08A; --warn:#E3A44A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1015; --card:#161A21; --panel:#1B2029; --ink:#EEF1F6; --muted:#A3ACBE; --faint:#7D879B; --line:#2A303B;
  --accent:#4AB3F6; --accent-ink:#7CC8FA; --accent-soft:#16324A; --aroll:#3A414E; --overlay:#2D6A93; --cut:#3BA5F2; --ok:#5FC08A; --warn:#E3A44A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.card{background:var(--card);border-radius:14px;border:1px solid var(--line)}
header.top{padding:28px 30px 24px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:clamp(30px,4.6vw,50px);font-weight:800;letter-spacing:-.025em;line-height:1.05;text-wrap:balance}
h1 em{font-family:var(--serif);font-style:italic;font-weight:600;color:var(--accent);letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--muted);font-size:13.5px}
.meta b{color:var(--ink);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pill{font-size:13px;padding:7px 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.pill[data-state="saving"]{opacity:.85}
.pill[data-state="off"]{background:var(--panel);color:var(--warn)}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:9px;font-size:13.5px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.seg:focus-visible,.use:focus-visible,.playbtn:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tl-label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:6px}
.tl{display:flex;gap:3px;width:100%;min-width:0}
.seg{border:0;height:38px;border-radius:5px;min-width:0;color:var(--ink);font-size:12.5px;font-weight:600;background:var(--aroll);padding:0;overflow:hidden;white-space:nowrap}
.seg[data-kind="Overlay on A-roll"]{background:var(--overlay)}
.seg[data-kind="Cut-away scene"]{background:var(--cut);color:#fff}
.seg[data-kind="own"]{background:var(--card);color:var(--accent-ink);box-shadow:inset 0 0 0 2px var(--accent)}
.ticks{position:relative;height:16px;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.ticks span{position:absolute;transform:translateX(-50%)} .ticks span:first-child{transform:none} .ticks span:last-child{transform:translateX(-100%)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--aroll)}
.legend i.o{background:var(--overlay)} .legend i.c{background:var(--cut)} .legend i.w{background:transparent;box-shadow:inset 0 0 0 2px var(--accent)}
.ownplan{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--card)}
.ownplan.chosen{border-style:solid;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.ownhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.ownplan h3{margin:0 0 2px;font-size:14.5px;font-weight:700;line-height:1.25}
.ownplan .cat{font-size:12.5px;color:var(--muted)}
.useown{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 13px;font-size:12.5px;font-weight:600;cursor:pointer;flex:none}
.ownplan.chosen .useown{background:var(--accent);border-color:var(--accent);color:#fff}
.useown:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.owntext{min-height:84px}
.beat{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);overflow:hidden;scroll-margin-top:16px}
.beat-main{padding:24px 26px 26px;display:flex;flex-direction:column;gap:14px;min-width:0;container-type:inline-size}
.beat-side{background:var(--panel);padding:24px 24px 26px;display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:14px 18px;align-content:start;border-left:1px solid var(--line);min-width:0}
.beat h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.015em;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.beat h2 .t{font-size:15px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.beat h2 .status:empty{display:none}
.beat h2 .status{font-size:12px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);padding:3px 9px;border-radius:999px}
textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;font-size:14.5px;color:var(--ink);background:var(--card)}
textarea::placeholder{color:var(--faint)}
.lbl{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.opt{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:116px minmax(0,1fr);gap:12px;background:var(--card);align-content:start}
.opt.chosen{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.ov{position:relative;width:116px;aspect-ratio:9/16;border-radius:8px;overflow:hidden;background:#000;align-self:start}
.ov img,.ov video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ovbtn{position:absolute;inset:0;border:0;padding:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ovbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ovplay{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.58);display:grid;place-items:center;transition:opacity .15s}
.ovplay::before{content:"";margin-left:4px;border-left:13px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent}
.ov.playing:not(.paused) .ovplay{opacity:0}
.ov.playing:not(.paused):hover .ovplay{opacity:1}
.ov.playing:not(.paused):hover .ovplay::before{margin-left:0;width:12px;height:16px;border:0;border-left:4px solid #fff;border-right:4px solid #fff;box-sizing:border-box}
.ovt{position:absolute;right:6px;bottom:9px;font-size:11px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px rgba(0,0,0,.7);pointer-events:none}
.ovtag{position:absolute;left:6px;top:6px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.5);padding:2px 6px;border-radius:999px;pointer-events:none}
.ovbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.28);pointer-events:none}
.ovbar b{position:absolute;inset:0 auto 0 0;width:0;background:#fff}
.opt h3{margin:0 0 4px;font-size:14.5px;font-weight:700;line-height:1.25;text-wrap:balance}
.opt .cat{font-size:12px;color:var(--accent-ink);font-weight:500;line-height:1.35;margin-bottom:6px}
.opt p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45}
.opt .ref{font-size:11.5px;color:var(--faint);margin-top:6px}
.opt .row{grid-column:1/-1;display:flex;gap:8px;justify-content:center;margin-top:4px}
.mine{font-size:12px;color:var(--accent-ink);border:1px solid var(--accent);border-radius:999px;padding:4px 10px;font-weight:500}
.use{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 13px;font-size:12.5px;font-weight:600}
.opt.chosen .use{background:var(--accent);border-color:var(--accent);color:#fff}
.script{grid-column:1;margin:0;font-size:17px;line-height:1.45;font-weight:500;letter-spacing:-.005em}
.side-lbl{grid-column:1}
.player{grid-column:2;grid-row:1/span 4;position:relative;width:170px;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:#000;align-self:start}
.player img,.player video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.playbtn{position:absolute;inset:0;border:0;background:transparent;display:flex;align-items:flex-end;padding:0}
.playbar{width:100%;display:flex;align-items:center;gap:8px;padding:10px 10px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:11.5px;font-variant-numeric:tabular-nums}
.playbar .tri{width:0;height:0;border-left:9px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}
.playbar .track{flex:1;height:3px;background:rgba(255,255,255,.35);border-radius:2px;position:relative;overflow:hidden}
.playbar .track b{position:absolute;inset:0 auto 0 0;width:0;background:#fff}
.note{grid-column:1;margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.cam{grid-column:1;margin:0;font-size:12.5px;color:var(--accent-ink)}
.credit{font-size:13px;color:var(--muted)}
.credit b{color:var(--ink)}
.credit a{color:var(--accent-ink);font-weight:600;text-decoration:none}
.credit a:hover{text-decoration:underline}
.wm{position:fixed;right:14px;bottom:12px;z-index:40;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;opacity:.9;text-decoration:none}
.wm:hover{opacity:1;color:var(--accent-ink);border-color:var(--accent)}
footer{font-size:12.5px;color:var(--muted);padding:20px 26px;display:flex;flex-direction:column;gap:6px}
footer a{color:var(--accent-ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.packmsg{font-size:12.5px;color:var(--muted)}
.steps{grid-column:1/-1;font-size:13.5px;color:var(--muted);line-height:1.5}
.steps b{color:var(--ink)}
.refs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:-4px}
.refs .lbl{width:100%}
.rlist{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.rlist:empty{display:none}
.rthumb{margin:0;display:flex;flex-direction:column;gap:4px;flex:none;min-width:96px;max-width:180px}
.rthumb .rview{align-self:flex-start;display:block;min-width:54px;min-height:96px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0;cursor:zoom-in;line-height:0}
.rthumb .rview:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rthumb img{display:block;height:96px;width:auto;max-width:178px;object-fit:contain;border-radius:7px}
.rthumb figcaption{width:0;min-width:100%;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);line-height:1.3}
.rthumb .rname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.rthumb .x,.rthumb .yes,.rthumb .no{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--accent-ink);cursor:pointer}
.rthumb .yes{color:#C2410C}
.rthumb .ask{display:none}
.rthumb.confirm .ask{display:inline}
.rthumb.confirm .x{display:none}
.rthumb.busy{width:96px;height:96px;border:1px dashed var(--line);border-radius:8px;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--muted)}
.addref{border:1px dashed var(--line);background:transparent;color:var(--ink);border-radius:8px;height:96px;padding:0 14px;font-size:12.5px;font-weight:600;cursor:pointer}
.addref:hover{border-color:var(--accent)}
.beat-main.drop{outline:2px dashed var(--accent);outline-offset:-6px}
.refmsg{font-size:12.5px;color:var(--muted)}
.refmsg.err{color:#C2410C}
.review{border:1px solid var(--accent);border-radius:12px;padding:14px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;background:var(--accent-soft)}
.review .ov{width:150px}
.review p{margin:6px 0 12px;font-size:13.5px;line-height:1.5;color:var(--ink)}
.rvbtns{display:flex;gap:8px;flex-wrap:wrap}
.approve{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer}
.review.ok .approve{background:var(--card);color:var(--accent-ink)}
.more{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.lightbox[hidden]{display:none}
.lbbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;color:#fff;font-size:13px;max-width:100%}
.lbbar .lbname{font-weight:600;overflow-wrap:anywhere}
.lbbar .lbinfo{color:rgba(255,255,255,.7)}
.lbbar a,.lbbar button{border:0;border-radius:999px;background:#fff;color:#111;font:inherit;font-weight:700;padding:6px 12px;cursor:pointer;text-decoration:none}
.lightbox img{display:block;width:auto;height:auto;max-width:100%;max-height:calc(100vh - 90px);object-fit:contain}
@media (max-width:1180px){.beat{grid-template-columns:minmax(0,1fr)}.beat-side{border-left:0;border-top:1px solid var(--line)}}
@container (max-width:760px){.opts{grid-template-columns:minmax(0,1fr)}.opt{grid-template-columns:120px minmax(0,1fr)}.ov{width:120px}.opt .row{grid-column:2;justify-content:flex-start}}
@media (max-width:520px){header.top,.beat-main,.beat-side{padding-inline:16px}.beat-side{grid-template-columns:minmax(0,1fr)}.player{grid-column:1;grid-row:auto;width:min(220px,100%)}.seg{font-size:0}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<div class="wrap">
  <header class="card top">
    <h1 id="ptitle">Edit <em>plan</em></h1>
    <div class="credit">Made by <b>@ond.finds</b> &#xb7; <a href="https://www.instagram.com/ond.finds/" target="_blank" rel="noopener">Instagram</a> &#xb7; <a href="https://www.tiktok.com/@ond.finds" target="_blank" rel="noopener">TikTok</a></div>
    <div class="meta" id="meta"></div>
    <div class="actions"><span class="pill" id="savepill" data-state="idle" role="status">Connecting&#x2026;</span><button class="btn" id="copy" type="button">Copy Plan + files</button><span class="packmsg" id="packmsg" role="status"></span></div>
    <div class="steps" id="steps" role="status"></div>
    <div class="tl-label">Beat timeline &#xb7; my suggested picks, updated by your choices</div>
    <div class="tl" id="tl" role="list"></div>
    <div class="ticks" id="ticks"></div>
    <div class="legend"><span><i></i>A-roll + captions</span><span><i class="o"></i>Overlay on A-roll</span><span><i class="c"></i>Cut-away scene</span><span><i class="w"></i>Your own plan</span></div>
  </header>
  <div id="beats" class="wrap" style="gap:18px"></div>
  <footer class="card" id="foot"></footer>
  <a class="wm" href="https://www.instagram.com/ond.finds/" target="_blank" rel="noopener" aria-label="Made by @ond.finds on Instagram">Made by @ond.finds</a>
  <div class="lightbox" id="lb" hidden role="dialog" aria-modal="true" aria-label="Reference image">
    <div class="lbbar"><span class="lbname"></span><span class="lbinfo"></span><a class="lbopen" target="_blank" rel="noopener">Open original</a><button class="lbclose" type="button">Close</button></div>
    <img alt="">
  </div>
</div>
<video id="player" src="media/clip.mp4" playsinline preload="metadata" hidden></video>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script id="plan-data" type="application/json">__PLAN_DATA__</script>
<script>
const D = JSON.parse(document.getElementById("plan-data").textContent);
document.getElementById("ptitle").innerHTML = (D.title || "Edit").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])) + " <em>edit plan</em>"; document.title = (D.title || "Edit") + " Plan";
const $ = (s, r = document) => r.querySelector(s);
const fmt = t => { const m = Math.floor(t / 60), s = t - m * 60; return `${m}:${s.toFixed(1).padStart(4, "0")}`; };
const state = {}; // n -> {pick, note}
D.beats.forEach(b => state[b.n] = { pick: null, note: "", own: "", refs: [], ownRefs: [], approved: null });
const PICKS = ["A", "B", "C", "own"];
let assets = null; // the assets capability, once this view grants it
const okId = id => typeof id === "string" && /^[A-Za-z0-9_-]{8,64}$/.test(id);
const num = v => Number.isFinite(v) && v >= 0 ? v : 0;
const normRef = r => typeof r === "string" ? (okId(r) ? { id: r, name: "", type: "", bytes: 0, w: 0, h: 0 } : null)
  : r && okId(r.id) ? { id: r.id, name: typeof r.name === "string" ? r.name.slice(0, 120) : "", type: typeof r.type === "string" ? r.type.slice(0, 40) : "", bytes: num(r.bytes), w: num(r.w), h: num(r.h) } : null;
const mb = b => b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
// ---------- header
$("#meta").innerHTML = `<span><b>Clip</b> ${D.clip}</span><span><b>Length</b> ${D.length} s \u00b7 ${D.beats.length} beats</span><span><b>Source</b> ${D.source}</span><span><b>Style</b> ${D.style}</span>`;
const tl = $("#tl"), total = D.length;
D.beats.forEach(b => {
  const s = document.createElement("button"); s.className = "seg"; s.type = "button"; s.id = "seg-" + b.n; s.setAttribute("role", "listitem");
  s.style.flex = `${(b.end - b.start).toFixed(3)} 1 0`; s.textContent = b.n; s.title = `Beat ${b.n} \u00b7 ${fmt(b.start)}\u2013${fmt(b.end)}`;
  s.addEventListener("click", () => document.getElementById("beat-" + pad(b.n)).scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }));
  tl.appendChild(s);
});
[0, total / 4, total / 2, total * 3 / 4, total].forEach((t, i) => { const sp = document.createElement("span"); sp.style.left = (t / total * 100) + "%"; sp.textContent = Math.round(t) + " s"; $("#ticks").appendChild(sp); });
// ---------- beats
const box = $("#beats");
D.beats.forEach(b => {
  const sec = document.createElement("section"); sec.className = "card beat"; sec.id = "beat-" + pad(b.n);
  sec.innerHTML = `
  <div class="beat-main">
    <h2>Beat ${b.n} <span class="t">${fmt(b.start)} \u2013 ${fmt(b.end)}</span> <span class="status" id="st-${b.n}"></span></h2>
    <label class="sr" for="note-${b.n}">Your plan for beat ${b.n}</label>
    <textarea id="note-${b.n}" placeholder="Changes for this beat (optional). Pick a design below, then write anything you want changed here."></textarea>
    <div class="refs" data-n="${b.n}" data-field="refs"><span class="lbl">Reference images</span><span class="rlist"></span>
      <button class="addref" type="button" hidden>+ Add images</button><input class="rfile" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
      <span class="refmsg" role="status"></span></div>
    <div class="lbl">Design options \u00b7 tap a preview to play it with his audio</div>
    <div class="opts">${b.options.map(o => `
      <article class="opt" data-letter="${o.letter}">

  const st = state[b.n], out = [];
  st.ownRefs.forEach((r, k) => out.push({ id: r.id, name: `images/beat-${pad(b.n)}_own-plan_${k + 1}_${safe(r.name)}`, label: r.name || r.id, own: true }));
  st.refs.forEach((r, k) => out.push({ id: r.id, name: `images/beat-${pad(b.n)}_changes_${k + 1}_${safe(r.name)}`, label: r.name || r.id, own: false }));
  return out;
}
function planText() {
  const isOwn = b => state[b.n].pick === "own" && state[b.n].own.trim();
  const picked = D.beats.filter(b => chosen(b) || isOwn(b)).length, owns = D.beats.filter(isOwn).length;
  const withRev = D.beats.filter(b => b.rev), appr = withRev.filter(b => state[b.n].approved === b.rev.v).length;
  const lines = [`${D.title} \u2014 edit plan (${D.clip}, ${D.length} s, ${D.beats.length} beats)`,
    `Picked by you: ${picked} of ${D.beats.length} beats${owns ? ` (${owns} with your own plan)` : ""}. The others stay on my pick (A).`,
    ...(withRev.length ? [`Approved: ${appr} of ${withRev.length} revised scenes.`] : []),
    `Files: images/ and videos/ in the zip that comes with this plan.`,
    `Made by @ond.finds \u00b7 Instagram: https://www.instagram.com/ond.finds/ \u00b7 TikTok: https://www.tiktok.com/@ond.finds`, ""];
  D.beats.forEach(b => { const st = state[b.n], note = (st.note || "").trim(), descs = b.options.map(x => x.desc), imgs = beatImages(b), vid = beatVideo(b);
    let head;
    if (isOwn(b)) {
      head = [`  Design: D \u00b7 Your own plan`, ...st.own.trim().split(/\r?\n/).filter(l => l.trim()).map(l => "  " + l.trim()),
        `  Reference images for your plan: ${imgs.filter(i => i.own).map(i => i.name).join(", ") || "none"}`];
    } else { const c = chosen(b) || b.options[0];
      head = [`  Design: ${c.letter} \u00b7 ${c.title} [${c.cat} \u00b7 ${c.kind}] (${chosen(b) ? "your pick" : st.pick === "own" ? "my pick: your own plan is still empty" : "my pick"})`, `  ${c.desc}`]; }
    const base = isOwn(b) ? "" : (chosen(b) || b.options[0]).desc;
    let change = ""; if (note && !descs.includes(note)) change = base && note.startsWith(base) ? note.slice(base.length).trim() : note;
    lines.push(`Beat ${b.n} (${fmt(b.start)}\u2013${fmt(b.end)}): "${b.script}"`, ...head, `  Changes: ${change || "none"}`,
      `  Reference images: ${imgs.filter(i => !i.own).map(i => i.name).join(", ") || "none"}`,
      ...(b.rev ? [`  Revised v${b.rev.v}: ${st.approved === b.rev.v ? "approved" : "not approved yet"}`] : []),
      `  Video: ${vid ? vid.name : "none yet"}`, ""); });
  return lines.join("\n");
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) { const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;left:-9999px"; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (_) {} ta.remove(); return ok; }
}
async function buildPack(text) {
  const zip = new JSZip(); zip.file("plan.txt", text);
  zip.file("CREDITS.txt", `Edit plan and workflow by @ond.finds\nInstagram: https://www.instagram.com/ond.finds/\nTikTok: https://www.tiktok.com/@ond.finds\n`);
  zip.file("plan.json", JSON.stringify(D.beats.map(b => ({ beat: b.n, start: b.start, end: b.end, script: b.script, pick: state[b.n].pick, note: state[b.n].note,
    own: state[b.n].own, refs: state[b.n].refs, ownRefs: state[b.n].ownRefs, approved: state[b.n].approved, rev: b.rev || null })), null, 1));
  const jobs = []; let missing = 0;
  D.beats.forEach(b => { beatImages(b).forEach(i => jobs.push([i.name, "/_blob/" + i.id])); const v = beatVideo(b); if (v) jobs.push([v.name, v.src]); });
  let done = 0;
  for (const [name, url] of jobs) {
    try { const r = await fetch(url); if (!r.ok) throw 0; zip.file(name, await r.blob()); } catch (e) { missing++; }
    $("#packmsg").textContent = `Preparing files\u2026 ${++done} of ${jobs.length}`;
  }
  return { blob: await zip.generateAsync({ type: "blob", compression: "STORE" }), count: jobs.length - missing, missing };
}
$("#copy").addEventListener("click", async () => {
  const btn = $("#copy"), msg = $("#packmsg"), text = planText();
  btn.disabled = true;
  const copied = await copyText(text);
  msg.textContent = copied ? "Plan copied." : "Couldn't copy the text.";
  if (!downloads || typeof JSZip === "undefined") { msg.textContent += " The files download works on the published page."; btn.disabled = false; return; }
  try {
    const pack = await buildPack(text);
    msg.textContent = "Save the files when asked\u2026";
    await downloads.save({ filename: (D.title || "edit").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-plan.zip", data: pack.blob });
    msg.textContent = `Plan copied and ${pack.count} files saved${pack.missing ? ` (${pack.missing} couldn't be read)` : ""}.`;
  } catch (e) {
    const code = e && e.code;
    msg.textContent = (copied ? "Plan copied. " : "") + (code === "declined" ? "Files not saved." : code === "rate_limited" ? "A save is already open; try again in a moment." : "The files couldn't be saved in this view.");
  }
  btn.disabled = false;
});
</script>
